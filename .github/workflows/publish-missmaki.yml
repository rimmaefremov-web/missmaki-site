name: Publish MissMaki
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: 'candidate — normal site; safe-fallback — pause new submissions'
        required: true
        default: candidate
        type: choice
        options: [candidate, safe-fallback]
permissions:
  contents: read
concurrency:
  group: missmaki-production
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Verify and build approved release
        env:
          RELEASE_MODE: ${{ inputs.mode || 'candidate' }}
        run: |
          node scripts/prepare-launch.mjs --config release/production-public.json --output "$RUNNER_TEMP/missmaki-release"
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          const m=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/missmaki-release/release-manifest.json'));
          const a=JSON.parse(readFileSync('release/production-approval.json'));
          if(!a.publicationAuthorized||a.domain!=='missmaki.ru'||m.pickupCells.state!=='owner_confirmed_installed_and_self_checked'||m.blockers.length!==1||m.blockers[0]!=='Explicit owner approval for production publication is required')throw Error('Release evidence missing');
          JS
          case "$RELEASE_MODE" in candidate|safe-fallback) ;; *) exit 1 ;; esac
          echo "PAGE_PATH=$RUNNER_TEMP/missmaki-release/$RELEASE_MODE" >> "$GITHUB_ENV"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.PAGE_PATH }}
  deploy:
    needs: prepare
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy approved site
        id: deployment
        uses: actions/deploy-pages@v4
