<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MissMaki — доставка роллов</title><style>*{box-sizing:border-box}body{margin:0;font:15px -apple-system,BlinkMacSystemFont,Arial,sans-serif;color:#222;background:#fff}header{text-align:center;padding:26px 12px;border-bottom:1px solid #eee}h1{font-size:36px;letter-spacing:2px;margin:0}header p{font-size:12px;color:#777}main{max-width:780px;margin:auto;padding:0 14px 110px}nav{display:flex;gap:8px;overflow:auto;position:sticky;top:0;background:white;padding:12px 0;z-index:4}nav a{white-space:nowrap;border-radius:25px;background:#f1f1f1;color:#222;text-decoration:none;padding:10px 14px;font-size:13px}section{scroll-margin-top:75px}h2{font-size:23px;margin:30px 0 14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.item{border:1px solid #eaeaea;border-radius:18px;padding:15px;box-shadow:0 3px 12px #00000006}.producthead{display:flex;gap:12px;align-items:center}.picture{height:85px;width:90px;flex:none;display:grid;place-items:center;background:#faf7f4;border-radius:14px;font-size:40px}.picture img{width:100%;height:100%;object-fit:cover;border-radius:14px}h3{font-size:17px;margin:0 0 6px}.description{font-size:12px;color:#777;margin:0}.choices{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}.choices button{border:1px solid #ddd;background:white;padding:8px;border-radius:9px;font-size:12px}.choices button.active{background:#222;color:#fff}.bottom{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:8px}.add,.send{border:0;background:#181818;color:white;padding:12px;border-radius:10px;font-weight:600}.basket{background:#fafafa;padding:17px;border-radius:16px;margin-top:25px}.line{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid #e5e5e5}.line button{border:1px solid #ddd;background:white;border-radius:7px;padding:6px 10px}input,select,textarea{width:100%;padding:13px;margin:7px 0;border:1px solid #ddd;border-radius:9px;font:16px Arial}.send{width:100%;font-size:16px}.send:disabled{opacity:.5}.note{font-size:12px;color:#666;line-height:1.5}.sticky{position:fixed;bottom:0;left:0;right:0;background:white;padding:12px;border-top:1px solid #eee;text-align:center}.sticky a{display:block;max-width:780px;margin:auto;background:#222;color:white;text-decoration:none;border-radius:12px;padding:14px}html{scroll-behavior:smooth}</style></head><body><header><h1>MissMaki</h1><p>Роллы и сеты с доставкой</p></header><main><nav><a href="#rolls">Роллы</a><a href="#baked">Запечённые</a><a href="#sets">Сеты</a><a href="#sushi">Суши</a><a href="#extras">Дополнения</a><a href="#order">Корзина</a></nav><div id="menu"></div><section id="order" class="basket"><h2>Корзина</h2><div id="cart"></div><h3 id="total"></h3><h2>Оформление заказа</h2><input id="name" placeholder="Ваше имя" autocomplete="name"><input id="phone" type="tel" placeholder="Номер телефона" autocomplete="tel"><select id="area"><option value="">Выберите ваш СНТ / район</option><option>Южный</option><option>мкр. Олимпийский</option><option>СНТ Ивушка</option><option>СТ Механизатор</option><option>ДНП Виктория</option><option>СТ Орбита</option><option>СТ Аэропорт</option><option>СТ Родник</option></select><input id="address" placeholder="Улица, дом, участок"><textarea id="comment" placeholder="Комментарий к заказу" rows="3"></textarea><p class="note">Доставка 200 ₽, при заказе от 3000 ₽ — бесплатно. Без регистрации.</p><button class="send" id="send" onclick="checkout()">Отправить заказ</button><p id="status" class="note" role="status">Заказ принят только после подтверждения MissMaki.</p></section></main><div class="sticky"><a href="#order" id="badge">Корзина · 0 ₽</a></div><script>
const groups=[
['rolls','Роллы',[
['Филадельфия',470,'Лосось, сливочный сыр, огурец', [['Классическая',470],['Угорь',510],['Креветка',500]]],['Калифорния',320,'Масаго, огурец, рис, нори',[['Краб',320],['Креветка',420],['Лосось',420],['Угорь',450]]],['Хосомаки',160,'Рис, нори',[['Огурец',160],['Краб',200],['Лосось',270],['Угорь',300],['Креветка',270],['Курица',250]]],['Канада',530,'Угорь, сливочный сыр, огурец, унаги, кунжут',[['Классическая',530],['Лосось',570],['Креветка',570]]],['Сакура',320,'Сливочный сыр, огурец, рис, нори',[['Краб',320],['Лосось',370],['Креветка',370],['Угорь',420]]],['Цезарь',390,'Соус цезарь, сухари, пармезан, томат',[['Курица',390],['Лосось',430],['Креветка',430]]],['Дабл чизз',730,'Лосось, сливочный сыр, огурец'],['Тори маки',470,'Курица, угорь, сыр, огурец, спайси и унаги'],['Рассвет',380,'Краб, сливочный сыр, огурец, кунжут'],['Дуэт',500,'Лосось и угорь, сливочный сыр, унаги, кунжут'],['Премиум',900,'Лосось, угорь, креветка, авокадо, сливочный сыр'],['Люкс ролл',460,'Краб, сливочный сыр, огурец, чёрный кунжут']]],
['baked','Запечённые и горячее',[
['Запечённый с масаго',400,'Сыр, огурец, масаго',[['Краб',400],['Лосось',460],['Креветка',460],['Тунец',470]]],['Запечённый с кунжутом',400,'Сливочный сыр, огурец, кунжут',[['Шиитаке',400],['Курица',420],['Мидии',430],['Угорь',470]]],['Мини-хот',250,'Рис, нори, соус',[['Краб',250],['Мидии',270],['Курица',280],['Лосось',300],['Креветка',300],['Угорь',320],['Тунец',320]]],['Суши-пицца',500,'Томат, сырный соус, рис, нори',[['Курица',500],['Лосось',550],['Креветка',550],['Угорь',560],['Тунец',560]]],['Филадельфия хот',500,'Запечённый лосось, сыр, спайси, унаги'],['Спайси ролл',490,'Масаго, огурец, сыр, спайси',[['Лосось',490],['Креветка',490],['Угорь',520],['Тунец',520]]]]],
['sets','Сеты',[
['Мини сет',750,'2 мини-хот и 2 гункана'],['Сет Филадельфия',1650,'Филадельфия, Сакура, Филадельфия хот, Дуэт'],['Хот сет',1270,'4 горячих ролла'],['Сет Микс',1650,'5 роллов'],['Мега сет',3900,'13 роллов, 104 кусочка'],['Топ сет',1090,'3 ролла'],['Сет Бестселлер',1850,'6 роллов'],['Сет Хит',2750,'7 роллов'],['Сет Унаги',1620,'4 ролла'],['Набор MissMaki',5350,'Большой фирменный набор'],['Суши сет',1550,'12 суши и гунканов']]],
['sushi','Суши и гунканы',[
['Спайси гункан',130,'1 штука',[['Лосось',130],['Креветка',130],['Угорь',130],['Краб',130]]],['Суши',130,'1 штука',[['Лосось',130],['Угорь',130],['Масаго',130],['Креветка',130]]],['Запечённые мидии киви',150,'1 ракушка',[['Сырный соус',150],['Спайси соус',150]]]]],
['extras','Дополнения',[
['Соус',50,'30 мл',[['Спайси',50],['Соевый',10],['Цезарь',50],['Унаги',50]]],['Палочки',10,'1 пара'],['Имбирь',10,'10 г'],['Васаби',10,'10 г']]]];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=n=>n.toLocaleString('ru-RU');const selected={},cart={};let seq=0;const products=[];for(const g of groups)for(const p of g[2])products.push({id:++seq,group:g[0],name:p[0],price:p[1],desc:p[2],opts:p[3]});
function render(){document.getElementById('menu').innerHTML=groups.map(g=>`<section id="${g[0]}"><h2>${g[1]}</h2><div class="grid">${products.filter(p=>p.group===g[0]).map(p=>{const choice=p.opts?.[selected[p.id]||0];const price=choice?choice[1]:p.price;return `<article class="item"><div class="producthead"><div class="picture">🍣</div><div><h3>${esc(p.name)}</h3><p class="description">${esc(p.desc)}${['rolls','baked'].includes(p.group)?' · 8 шт.':''}</p></div></div>${p.opts?`<div class="choices">${p.opts.map((o,i)=>`<button class="${(selected[p.id]||0)===i?'active':''}" onclick="select(${p.id},${i})">${esc(o[0])} · ${fmt(o[1])} ₽</button>`).join('')}</div>`:''}<div class="bottom"><b>${fmt(price)} ₽</b><button class="add" onclick="add(${p.id})">В корзину</button></div></article>`}).join('')}</div></section>`).join('')}
function select(id,i){selected[id]=i;render()}function add(id){const p=products.find(x=>x.id===id),i=selected[id]||0,o=p.opts?.[i],key=id+':'+(o?i:'x');if(!cart[key])cart[key]={sku:key,name:p.name+(o?' — '+o[0]:''),price:o?o[1]:p.price,quantity:0};cart[key].quantity++;renderCart()}function change(key,n){if(!cart[key])return;cart[key].quantity+=n;if(cart[key].quantity<1)delete cart[key];renderCart()}function totals(){const subtotal=Object.values(cart).reduce((s,x)=>s+x.price*x.quantity,0);const delivery=subtotal>=3000||!subtotal?0:200;return {subtotal,delivery,total:subtotal+delivery}}
function renderCart(){const t=totals();document.getElementById('cart').innerHTML=Object.entries(cart).map(([k,v])=>`<div class="line"><span>${esc(v.name)}<small> · ${fmt(v.price)} ₽ × ${v.quantity}</small></span><span><button onclick="change('${k}',-1)">−</button> ${v.quantity} <button onclick="change('${k}',1)">+</button></span></div>`).join('')+`<div class="line">Доставка <b>${t.delivery?fmt(t.delivery)+' ₽':'Бесплатно'}</b></div>`;document.getElementById('total').textContent='Итого: '+fmt(t.total)+' ₽';document.getElementById('badge').textContent='Корзина · '+fmt(t.total)+' ₽'}
const ENDPOINT='https://script.google.com/macros/s/AKfycbypTmSYACXKHqKUXoCpnpJZpkhgH5s1NMJM3vtpBqBorNM14k76A8UM3wa_Mmoi3_VC/exec';let busy=false,pending=null;
function submit(order){return new Promise((resolve,reject)=>{const frame=document.createElement('iframe'),form=document.createElement('form'),field=document.createElement('input');frame.name='order_'+order.requestId.replace(/-/g,'');frame.hidden=true;form.method='POST';form.action=ENDPOINT;form.target=frame.name;form.hidden=true;field.type='hidden';field.name='payload';field.value=JSON.stringify(order);form.append(field);const cleanup=()=>{clearTimeout(timer);window.removeEventListener('message',receive);form.remove();frame.remove()};const receive=e=>{if(!/^https:\/\/(?:script\.google\.com|(?:[a-z0-9-]+[.-])?script\.googleusercontent\.com)$/.test(e.origin))return;const d=e.data;if(!d||d.type!=='missmaki-order-result'||d.requestId!==order.requestId)return;cleanup();resolve(d)};const timer=setTimeout(()=>{cleanup();reject(Error('Timeout'))},60000);window.addEventListener('message',receive);document.body.append(frame,form);form.submit()})}
async function checkout(){if(busy)return;const name=document.getElementById('name').value.trim(),phone=document.getElementById('phone').value.trim(),area=document.getElementById('area').value,address=document.getElementById('address').value.trim(),comment=document.getElementById('comment').value.trim(),items=Object.values(cart).map(x=>({...x}));if(!items.length)return alert('Корзина пуста');if(!name||!phone||!area||!address)return alert('Укажите имя, телефон, район и адрес');if(name.length>100||phone.length>50||address.length>300||comment.length>500)return alert('Сократите данные заказа');const {subtotal,delivery,total}=totals(),content={name,phone,area,address,comment,items,subtotal,delivery,total},button=document.getElementById('send'),status=document.getElementById('status');busy=true;button.disabled=true;button.textContent='Отправляем...';status.textContent='';try{const hash=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(JSON.stringify(content)));const fingerprint=Array.from(new Uint8Array(hash),v=>v.toString(16).padStart(2,'0')).join('');if(!pending){try{pending=JSON.parse(sessionStorage.getItem('missmaki-pending-order'))}catch(e){}}if(!pending||pending.fingerprint!==fingerprint||!/^[a-f0-9-]{36}$/.test(pending.requestId))pending={fingerprint,requestId:crypto.randomUUID()};try{sessionStorage.setItem('missmaki-pending-order',JSON.stringify(pending))}catch(e){}const result=await submit({...content,requestId:pending.requestId,origin:location.origin});if(result.ok!==true||result.telegramConfirmed!==true)throw Error('Not confirmed');for(const item of items){if(cart[item.sku]){cart[item.sku].quantity-=item.quantity;if(cart[item.sku].quantity<=0)delete cart[item.sku]}}pending=null;try{sessionStorage.removeItem('missmaki-pending-order')}catch(e){}renderCart();status.textContent='Заказ получен! Мы перезвоним в течение 10 минут.'}catch(e){status.textContent='Не удалось подтвердить заказ. Он мог быть отправлен — свяжитесь с MissMaki перед повторной отправкой.'}finally{busy=false;button.disabled=false;button.textContent='Отправить заказ'}}render();renderCart();
</script></body></html>
